<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Measure Tool</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0e0e0f;
    --surface: #1a1a1c;
    --border: #2e2e32;
    --accent: #e8ff47;
    --accent2: #47c8ff;
    --text: #f0f0ee;
    --muted: #888884;
    --danger: #ff6b6b;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 18px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  .logo {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: var(--text);
  }
  .logo span { color: var(--accent); }

  .controls {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .pill {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 12px;
    font-family: 'DM Mono', monospace;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .pill:hover, .pill.active {
    background: var(--accent);
    color: #000;
    border-color: var(--accent);
  }

  .tool-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 14px;
    font-size: 12px;
    font-family: 'DM Mono', monospace;
    color: var(--text);
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .tool-btn:hover { border-color: var(--accent); color: var(--accent); }
  .tool-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }

  .divider { width: 1px; height: 24px; background: var(--border); }

  .main {
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  /* Upload state */
  #upload-zone {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 40px;
    cursor: pointer;
    transition: all 0.2s;
    border: 2px dashed transparent;
    margin: 24px;
    border-radius: 16px;
  }
  #upload-zone:hover, #upload-zone.drag-over {
    border-color: var(--accent);
    background: rgba(232,255,71,0.03);
  }

  .upload-icon {
    width: 72px; height: 72px;
    border: 2px solid var(--border);
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
  }

  .upload-title { font-size: 24px; font-weight: 700; }
  .upload-sub { font-size: 14px; color: var(--muted); font-family: 'DM Mono', monospace; }

  .upload-btn {
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 8px;
    padding: 12px 28px;
    font-size: 14px;
    font-weight: 700;
    font-family: 'Syne', sans-serif;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .upload-btn:hover { opacity: 0.85; }

  /* Canvas area */
  #canvas-area {
    flex: 1;
    display: none;
    flex-direction: column;
    overflow: hidden;
  }

  #info-bar {
    padding: 8px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 20px;
    font-size: 12px;
    font-family: 'DM Mono', monospace;
    color: var(--muted);
    flex-wrap: wrap;
  }

  .info-tag {
    display: flex; align-items: center; gap: 6px;
  }
  .info-tag strong { color: var(--accent); font-weight: 500; }

  #scroll-container {
    flex: 1;
    overflow: auto;
    display: flex;
    align-items: flex-start;
    justify-content: flex-start;
    padding: 0;
    background: #080809;
    cursor: crosshair;
  }

  #ruler-layout {
    display: grid;
    grid-template-columns: 40px auto 40px;
    grid-template-rows: 28px auto 28px;
    padding: 0;
  }

  #ruler-corner-tr {
    width: 40px;
    height: 28px;
    background: #111;
    border-left: 1px solid #333;
    border-bottom: 1px solid #333;
    position: sticky;
    top: 0;
    right: 0;
    z-index: 4;
  }

  #ruler-corner-bl {
    width: 40px;
    height: 28px;
    background: #111;
    border-right: 1px solid #333;
    border-top: 1px solid #333;
    position: sticky;
    bottom: 0;
    left: 0;
    z-index: 4;
  }

  #ruler-corner-br {
    width: 40px;
    height: 28px;
    background: #111;
    border-left: 1px solid #333;
    border-top: 1px solid #333;
    position: sticky;
    bottom: 0;
    right: 0;
    z-index: 4;
  }

  #ruler-right-wrapper {
    position: sticky;
    right: 0;
    z-index: 3;
    width: 40px;
    line-height: 0;
  }

  #ruler-right {
    display: block;
    background: #111;
    border-left: 1px solid #333;
  }

  #ruler-bottom-wrapper {
    position: sticky;
    bottom: 0;
    z-index: 3;
    height: 28px;
    line-height: 0;
  }

  #ruler-bottom {
    display: block;
    background: #111;
    border-top: 1px solid #333;
  }

  #ruler-corner {
    width: 40px;
    height: 28px;
    background: #111;
    border-right: 1px solid #333;
    border-bottom: 1px solid #333;
    position: sticky;
    top: 0;
    left: 0;
    z-index: 4;
  }

  #ruler-top-wrapper {
    position: sticky;
    top: 0;
    z-index: 3;
    height: 28px;
    line-height: 0;
  }

  #ruler-top {
    display: block;
    background: #111;
    border-bottom: 1px solid #333;
  }

  #ruler-left-wrapper {
    position: sticky;
    left: 0;
    z-index: 3;
    width: 40px;
    line-height: 0;
  }

  #ruler-left {
    display: block;
    background: #111;
    border-right: 1px solid #333;
  }

  #canvas-wrapper {
    position: relative;
    display: inline-block;
    box-shadow: 0 0 0 1px var(--border);
  }

  #pdf-canvas {
    display: block;
  }

  #overlay-canvas {
    position: absolute;
    top: 0; left: 0;
    pointer-events: none;
  }

  #measure-canvas {
    position: absolute;
    top: 0; left: 0;
    cursor: crosshair;
  }

  /* Measurement tooltip */
  #measure-tooltip {
    position: fixed;
    background: #000;
    border: 1px solid var(--accent);
    color: var(--accent);
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 12px;
    font-family: 'DM Mono', monospace;
    pointer-events: none;
    display: none;
    z-index: 1000;
    white-space: nowrap;
  }

  /* Sidebar */
  #sidebar {
    width: 220px;
    min-width: 220px;
    border-left: 1px solid var(--border);
    background: var(--surface);
    display: none;
    flex-direction: column;
    overflow-y: auto;
  }

  .sidebar-section {
    padding: 16px;
    border-bottom: 1px solid var(--border);
  }

  .sidebar-label {
    font-size: 10px;
    font-family: 'DM Mono', monospace;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 10px;
  }

  .measurement-item {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    margin-bottom: 6px;
    font-size: 11px;
    font-family: 'DM Mono', monospace;
  }
  .measurement-item .val { color: var(--accent); font-size: 13px; font-weight: 500; }
  .measurement-item .sub { color: var(--muted); font-size: 10px; margin-top: 2px; }

  .clear-btn {
    width: 100%;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 6px;
    padding: 6px;
    font-size: 11px;
    font-family: 'DM Mono', monospace;
    cursor: pointer;
    margin-top: 8px;
    transition: all 0.15s;
  }
  .clear-btn:hover { border-color: var(--danger); color: var(--danger); }

  #file-input { display: none; }

  .zoom-controls {
    display: flex; align-items: center; gap: 6px;
  }
  .zoom-btn {
    width: 26px; height: 26px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-size: 14px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
    font-family: monospace;
  }
  .zoom-btn:hover { border-color: var(--accent); color: var(--accent); }
  #zoom-label { font-size: 12px; font-family: 'DM Mono', monospace; color: var(--muted); min-width: 40px; text-align: center; }

  /* Tick settings popover */
  .tick-wrapper { position: relative; }
  #tick-popover {
    display: none;
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    margin-top: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    z-index: 100;
    width: 220px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }
  #tick-popover.open { display: block; }
  .tick-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
    font-size: 11px;
    font-family: 'DM Mono', monospace;
    color: var(--muted);
  }
  .tick-row:last-child { margin-bottom: 0; }
  .tick-row label { color: var(--text); font-size: 11px; }
  .tick-pills {
    display: flex;
    gap: 4px;
  }
  .tick-pill {
    padding: 3px 8px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-size: 10px;
    font-family: 'DM Mono', monospace;
    cursor: pointer;
    transition: all 0.15s;
  }
  .tick-pill:hover { border-color: var(--accent); color: var(--accent); }
  .tick-pill.active { background: var(--accent); color: #000; border-color: var(--accent); }
  .tick-input {
    width: 60px;
    padding: 3px 6px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 11px;
    font-family: 'DM Mono', monospace;
    text-align: right;
  }
  .tick-input:focus { outline: none; border-color: var(--accent); }
  .tick-unit { color: var(--muted); font-size: 10px; margin-left: 4px; }

  /* Tile modal */
  #tile-modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 500;
    background: rgba(0,0,0,0.7);
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
  }
  #tile-modal.open { display: flex; }

  .tile-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    max-width: 740px;
    width: 95%;
    max-height: 90vh;
    overflow-y: auto;
  }
  .tile-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }
  .tile-header h3 {
    font-size: 16px;
    font-weight: 700;
    margin: 0;
  }
  .tile-body {
    display: flex;
    gap: 20px;
    padding: 20px;
  }
  .tile-form {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .tile-form-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .tile-form-row label {
    font-size: 12px;
    font-family: 'DM Mono', monospace;
    color: var(--text);
    white-space: nowrap;
  }
  .tile-form-row select {
    padding: 4px 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 11px;
    font-family: 'DM Mono', monospace;
  }
  .tile-form-row select:focus { outline: none; border-color: var(--accent); }
  .tile-summary {
    padding: 10px 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
    font-family: 'DM Mono', monospace;
    color: var(--accent);
    text-align: center;
    font-weight: 500;
  }
  .tile-preview-area {
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 260px;
  }
  #tile-preview-canvas {
    background: #fff;
    border-radius: 4px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.3);
  }
  .tile-footer {
    padding: 16px 20px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: flex-end;
    gap: 10px;
  }
  .tile-export-btn {
    padding: 10px 24px;
    font-size: 13px;
  }

  /* Mobile */
  @media (max-width: 768px) {
    header {
      padding: 10px 12px;
      gap: 8px;
    }
    .controls {
      gap: 6px;
    }
    .pill {
      padding: 4px 10px;
      font-size: 11px;
    }
    .tool-btn {
      padding: 5px 8px;
      font-size: 11px;
    }
    .divider { height: 20px; }
    #info-bar {
      padding: 6px 12px;
      gap: 10px;
      font-size: 10px;
    }
    #sidebar {
      display: none !important;
    }
    #ruler-corner, #ruler-corner-tr, #ruler-corner-bl, #ruler-corner-br {
      width: 28px;
    }
    #ruler-layout {
      grid-template-columns: 28px auto 28px;
    }
    #ruler-left-wrapper, #ruler-left, #ruler-right-wrapper, #ruler-right {
      width: 28px;
    }
    .zoom-controls { gap: 4px; }
    .zoom-btn { width: 24px; height: 24px; font-size: 12px; }
    #zoom-label { font-size: 10px; min-width: 32px; }
    .tile-body { flex-direction: column; }
    .tile-preview-area { min-width: unset; }
  }
</style>
</head>
<body>

<header>
  <a href="index.html" class="logo" style="text-decoration:none;color:inherit;">pdf<span>measure</span></a>

  <div class="controls" id="header-controls" style="display:none">
    <!-- Unit switcher -->
    <div class="pill active" data-unit="cm" onclick="setUnit('cm')">cm</div>
    <div class="pill" data-unit="mm" onclick="setUnit('mm')">mm</div>
    <div class="pill" data-unit="in" onclick="setUnit('in')">in</div>
    <div class="pill" data-unit="px" onclick="setUnit('px')">px</div>

    <div class="divider"></div>

    <!-- Grid toggle -->
    <button class="tool-btn active" id="grid-btn" onclick="toggleGrid()">
      ⊞ Grid
    </button>

    <!-- Ruler tool -->
    <button class="tool-btn" id="ruler-btn" onclick="toggleRuler()">
      📏 Measure
    </button>

    <!-- Draw line tool -->
    <button class="tool-btn" id="line-btn" onclick="toggleLineDraw()">
      ✏️ Draw Line
    </button>

    <!-- Tick marks settings -->
    <div class="tick-wrapper">
      <button class="tool-btn active" id="tick-btn" onclick="toggleTicks()">
        ┼ Ticks
      </button>
      <button class="tool-btn" id="tick-settings-btn" onclick="toggleTickPopover()" style="padding:4px 6px;font-size:10px;">▾</button>
      <div id="tick-popover">
        <div class="tick-row">
          <label>Length</label>
          <div class="tick-pills">
            <button class="tick-pill" data-tick-mode="small" onclick="setTickMode('small')">S</button>
            <button class="tick-pill active" data-tick-mode="medium" onclick="setTickMode('medium')">M</button>
            <button class="tick-pill" data-tick-mode="full" onclick="setTickMode('full')">Full</button>
          </div>
        </div>
        <div class="tick-row">
          <label>Spacing</label>
          <div style="display:flex;align-items:center;">
            <input type="text" class="tick-input" id="tick-spacing-input" placeholder="auto" oninput="setTickSpacing(this.value)">
            <span class="tick-unit" id="tick-unit-label">cm</span>
          </div>
        </div>
        <div class="tick-row" style="color:var(--muted);font-size:9px;">
          Leave spacing empty for auto (matches grid)
        </div>
      </div>
    </div>

    <div class="divider"></div>

    <!-- Zoom -->
    <div class="zoom-controls">
      <button class="zoom-btn" onclick="adjustZoom(-0.25)">−</button>
      <span id="zoom-label">100%</span>
      <button class="zoom-btn" onclick="adjustZoom(0.25)">+</button>
    </div>

    <div class="divider"></div>

    <!-- New file -->
    <button class="tool-btn" id="tile-btn" onclick="openTilePanel()">
      🖨 Tile for Print
    </button>

    <div class="divider"></div>

    <button class="tool-btn" onclick="document.getElementById('file-input').click()">↑ New File</button>
  </div>
</header>

<div class="main">
  <!-- Upload zone -->
  <div id="upload-zone" onclick="document.getElementById('file-input').click()">
    <div class="upload-icon">📄</div>
    <div class="upload-title">Drop your PDF here</div>
    <div class="upload-sub">or click to browse</div>
    <button class="upload-btn" onclick="event.stopPropagation(); document.getElementById('file-input').click()">Choose PDF</button>
  </div>

  <!-- Canvas area -->
  <div id="canvas-area">
    <div id="info-bar">
      <div class="info-tag">📄 <span id="info-filename">—</span></div>
      <div class="info-tag">📐 Size: <strong id="info-size">—</strong></div>
      <div class="info-tag">📏 Format: <strong id="info-format">—</strong></div>
      <div class="info-tag">🔲 <strong id="info-dims">—</strong></div>
    </div>
    <div style="display:flex; flex:1; overflow:hidden;">
      <div id="scroll-container">
        <div id="ruler-layout">
          <div id="ruler-corner"></div>
          <div id="ruler-top-wrapper"><canvas id="ruler-top"></canvas></div>
          <div id="ruler-corner-tr"></div>
          <div id="ruler-left-wrapper"><canvas id="ruler-left"></canvas></div>
          <div id="canvas-wrapper">
            <canvas id="pdf-canvas"></canvas>
            <canvas id="overlay-canvas"></canvas>
            <canvas id="measure-canvas"></canvas>
          </div>
          <div id="ruler-right-wrapper"><canvas id="ruler-right"></canvas></div>
          <div id="ruler-corner-bl"></div>
          <div id="ruler-bottom-wrapper"><canvas id="ruler-bottom"></canvas></div>
          <div id="ruler-corner-br"></div>
        </div>
      </div>
      <div id="sidebar">
        <div class="sidebar-section">
          <div class="sidebar-label">Measurements</div>
          <div id="measurements-list"></div>
          <button class="clear-btn" onclick="clearMeasurements()">✕ Clear measurements</button>
        </div>
        <div class="sidebar-section">
          <div class="sidebar-label">Drawn Lines</div>
          <div id="lines-list"><div style="font-size:11px;font-family:'DM Mono',monospace;color:var(--muted)">No lines yet. Hold Shift to snap H/V.</div></div>
          <button class="clear-btn" onclick="clearLines()">✕ Clear lines</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="measure-tooltip"></div>
<!-- Tile for Print modal -->
<div id="tile-modal" onclick="if(event.target===this)closeTilePanel()">
  <div class="tile-panel">
    <div class="tile-header">
      <h3>Tile for Print</h3>
      <button class="tool-btn" onclick="closeTilePanel()">✕</button>
    </div>
    <div class="tile-body">
      <div class="tile-form">
        <div class="tile-form-row">
          <label>Sheet size</label>
          <select id="tile-sheet-size" onchange="onTileSheetChange()">
            <option value="A4">A4 (210 x 297 mm)</option>
            <option value="A3">A3 (297 x 420 mm)</option>
            <option value="Letter">Letter (215.9 x 279.4 mm)</option>
            <option value="custom">Custom...</option>
          </select>
        </div>
        <div class="tile-form-row">
          <label>Orientation</label>
          <div class="tick-pills">
            <button class="tick-pill active" data-orient="portrait" onclick="setTileOrientation('portrait')">Portrait</button>
            <button class="tick-pill" data-orient="landscape" onclick="setTileOrientation('landscape')">Landscape</button>
          </div>
        </div>
        <div class="tile-form-row" id="tile-custom-dims" style="display:none">
          <label>W x H (mm)</label>
          <div style="display:flex;align-items:center;gap:4px;">
            <input class="tick-input" id="tile-custom-w" value="210" style="width:50px" oninput="updateTilePreview()">
            <span style="color:var(--muted)">x</span>
            <input class="tick-input" id="tile-custom-h" value="297" style="width:50px" oninput="updateTilePreview()">
          </div>
        </div>
        <div class="tile-form-row">
          <label>Gap between copies (mm)</label>
          <input class="tick-input" id="tile-gap" value="2" style="width:50px" oninput="updateTilePreview()">
        </div>
        <div class="tile-form-row">
          <label>Sheet margin (mm)</label>
          <input class="tick-input" id="tile-margin" value="5" style="width:50px" oninput="updateTilePreview()">
        </div>
        <div class="tile-form-row">
          <label>Crop marks</label>
          <div class="tick-pills">
            <button class="tick-pill" data-crop="off" onclick="setTileCropMarks(false)">Off</button>
            <button class="tick-pill active" data-crop="on" onclick="setTileCropMarks(true)">On</button>
          </div>
        </div>

            <span style="color:var(--muted)">x</span>

<input type="file" id="file-input" accept=".pdf">

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let pdfDoc = null;
let pageWidthPt = 0, pageHeightPt = 0;
let zoom = window.innerWidth <= 768 ? 0.75 : 1.5;
let unit = 'cm';
let showGrid = true;
let showTicks = true;
let tickMode = 'medium'; // 'small', 'medium', 'full'
let tickSpacingCustom = null; // null = match grid, or value in current unit
let rulerMode = false;
let lineDrawMode = false;
let rulerStart = null;
let lineStart = null;
let measurements = [];
let drawnLines = [];
let currentMousePos = null;
let pdfRawBytes = null;
let shiftHeld = false;

const PT_TO = { cm: 0.03527778, mm: 0.352778, in: 0.013889, px: 1.333333 };
const UNIT_LABEL = { cm: 'cm', mm: 'mm', in: '″', px: 'px' };
const GRID_SPACING = { cm: 72*0.393701, mm: 72*0.0393701*10, in: 72, px: 100 };

function ptToUnit(pt) { return pt * PT_TO[unit]; }
function fmtVal(val) { return unit === 'px' ? val.toFixed(0) : val.toFixed(2); }

// Detect paper format
function detectFormat(wPt, hPt) {
  const w = wPt * PT_TO.mm, h = hPt * PT_TO.mm;
  const formats = [
    { name:'A4', w:210, h:297 }, { name:'A3', w:297, h:420 },
    { name:'A5', w:148, h:210 }, { name:'Letter', w:215.9, h:279.4 },
    { name:'Legal', w:215.9, h:355.6 }
  ];
  for (const f of formats) {
    if ((Math.abs(w-f.w)<3 && Math.abs(h-f.h)<3) || (Math.abs(w-f.h)<3 && Math.abs(h-f.w)<3)) {
      return f.name + (w > h ? ' Landscape' : ' Portrait');
    }
  }
  return 'Custom';
}

async function loadPDF(file) {
  const arrayBuffer = await file.arrayBuffer();
  pdfRawBytes = new Uint8Array(arrayBuffer);
  pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  const page = await pdfDoc.getPage(1);
  const vp = page.getViewport({ scale: 1 });
  pageWidthPt = vp.width;
  pageHeightPt = vp.height;

  // Update info bar
  document.getElementById('info-filename').textContent = file.name;
  const wMM = (pageWidthPt * PT_TO.mm).toFixed(1);
  const hMM = (pageHeightPt * PT_TO.mm).toFixed(1);
  document.getElementById('info-size').textContent = `${wMM} × ${hMM} mm`;
  document.getElementById('info-format').textContent = detectFormat(pageWidthPt, pageHeightPt);
  document.getElementById('info-dims').textContent = `${pageWidthPt.toFixed(0)} × ${pageHeightPt.toFixed(0)} pt`;

  // Show UI
  document.getElementById('upload-zone').style.display = 'none';
  document.getElementById('canvas-area').style.display = 'flex';
  document.getElementById('header-controls').style.display = 'flex';
  document.getElementById('sidebar').style.display = 'flex';
  document.getElementById('zoom-label').textContent = Math.round(zoom * 100) + '%';

  renderPage();
}

async function renderPage() {
  const page = await pdfDoc.getPage(1);
  const vp = page.getViewport({ scale: zoom });

  const pdfCanvas = document.getElementById('pdf-canvas');
  const overlayCanvas = document.getElementById('overlay-canvas');
  const measureCanvas = document.getElementById('measure-canvas');
  const ctx = pdfCanvas.getContext('2d');

  pdfCanvas.width = vp.width;
  pdfCanvas.height = vp.height;
  overlayCanvas.width = vp.width;
  overlayCanvas.height = vp.height;
  measureCanvas.width = vp.width;
  measureCanvas.height = vp.height;

  await page.render({ canvasContext: ctx, viewport: vp }).promise;

  drawGrid();
  drawMeasurements();
}

function drawGrid() {
  const canvas = document.getElementById('overlay-canvas');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const spacingPt = GRID_SPACING[unit];
  const spacingPx = spacingPt * zoom;

  // Always draw rulers (even if grid overlay is off)
  drawRulers(canvas.width, canvas.height, spacingPx, spacingPt);

  // Edge tick marks on all four sides of the page
  if (showTicks) {
    // Custom spacing or match grid
    let tickSpPx = spacingPx;
    if (tickSpacingCustom !== null) {
      const ptPerUnit = 1 / PT_TO[unit];
      tickSpPx = tickSpacingCustom * ptPerUnit * zoom;
    }

    const isFull = tickMode === 'full';
    const tickLenH = isFull ? canvas.height : tickMode === 'medium' ? 12 : 6;
    const tickLenW = isFull ? canvas.width : tickMode === 'medium' ? 12 : 6;
    const lw = isFull ? 0.5 : 1.5;
    const alpha = isFull ? 0.35 : 0.8;

    ctx.setLineDash([]);

    // Vertical ticks (top & bottom, or full height)
    for (let x = tickSpPx; x < canvas.width; x += tickSpPx) {
      ctx.strokeStyle = `rgba(0,0,0,${alpha})`;
      ctx.lineWidth = lw;
      if (isFull) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
        ctx.strokeStyle = 'rgba(255,255,255,0.15)';
        ctx.lineWidth = 0.3;
        ctx.beginPath(); ctx.moveTo(x + 1, 0); ctx.lineTo(x + 1, canvas.height); ctx.stroke();
      } else {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, tickLenH); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x, canvas.height); ctx.lineTo(x, canvas.height - tickLenH); ctx.stroke();
        ctx.strokeStyle = 'rgba(255,255,255,0.4)';
        ctx.lineWidth = 0.5;
        ctx.beginPath(); ctx.moveTo(x + 1, 0); ctx.lineTo(x + 1, tickLenH); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x + 1, canvas.height); ctx.lineTo(x + 1, canvas.height - tickLenH); ctx.stroke();
      }
    }
    // Horizontal ticks (left & right, or full width)
    for (let y = tickSpPx; y < canvas.height; y += tickSpPx) {
      ctx.strokeStyle = `rgba(0,0,0,${alpha})`;
      ctx.lineWidth = lw;
      if (isFull) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
        ctx.strokeStyle = 'rgba(255,255,255,0.15)';
        ctx.lineWidth = 0.3;
        ctx.beginPath(); ctx.moveTo(0, y + 1); ctx.lineTo(canvas.width, y + 1); ctx.stroke();
      } else {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(tickLenW, y); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(canvas.width, y); ctx.lineTo(canvas.width - tickLenW, y); ctx.stroke();
        ctx.strokeStyle = 'rgba(255,255,255,0.4)';
        ctx.lineWidth = 0.5;
        ctx.beginPath(); ctx.moveTo(0, y + 1); ctx.lineTo(tickLenW, y + 1); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(canvas.width, y + 1); ctx.lineTo(canvas.width - tickLenW, y + 1); ctx.stroke();
      }
    }
  }

  if (!showGrid) return;

  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineWidth = 0.5;

  // Vertical lines
  for (let x = spacingPx; x < canvas.width; x += spacingPx) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
  }
  // Horizontal lines
  for (let y = spacingPx; y < canvas.height; y += spacingPx) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
  }
}

function drawRulers(pdfW, pdfH, spacingPx, spacingPt) {
  const rulerH = 28;
  const isMobile = window.innerWidth <= 768;
  const rulerW = isMobile ? 28 : 40;
  const fontSize = Math.max(8, (isMobile ? 8 : 10) * zoom / 1.5);

  // --- Top ruler ---
  const topCanvas = document.getElementById('ruler-top');
  topCanvas.width = pdfW;
  topCanvas.height = rulerH;
  topCanvas.style.width = pdfW + 'px';
  topCanvas.style.height = rulerH + 'px';
  const tCtx = topCanvas.getContext('2d');
  tCtx.fillStyle = '#111';
  tCtx.fillRect(0, 0, topCanvas.width, topCanvas.height);
  tCtx.font = `${fontSize}px DM Mono, monospace`;
  tCtx.fillStyle = '#ccc';
  tCtx.strokeStyle = '#555';
  tCtx.lineWidth = 0.5;

  tCtx.textAlign = 'center';
  tCtx.textBaseline = 'alphabetic';
  let i = 1;
  for (let x = spacingPx; x < pdfW; x += spacingPx) {
    tCtx.strokeStyle = '#888';
    tCtx.beginPath(); tCtx.moveTo(x, rulerH); tCtx.lineTo(x, rulerH - 12); tCtx.stroke();
    tCtx.fillStyle = '#ccc';
    const label = fmtVal(i * ptToUnit(spacingPt));
    const tw = tCtx.measureText(label).width;
    const lx = Math.min(x, pdfW - tw / 2 - 2);
    tCtx.fillText(label, Math.max(tw / 2 + 2, lx), rulerH - 13);
    i++;
  }

  // --- Bottom ruler ---
  const botCanvas = document.getElementById('ruler-bottom');
  botCanvas.width = pdfW;
  botCanvas.height = rulerH;
  botCanvas.style.width = pdfW + 'px';
  botCanvas.style.height = rulerH + 'px';
  const bCtx = botCanvas.getContext('2d');
  bCtx.fillStyle = '#111';
  bCtx.fillRect(0, 0, botCanvas.width, botCanvas.height);
  bCtx.font = `${fontSize}px DM Mono, monospace`;
  bCtx.fillStyle = '#ccc';
  bCtx.strokeStyle = '#555';
  bCtx.lineWidth = 0.5;

  bCtx.textAlign = 'center';
  bCtx.textBaseline = 'top';
  i = 1;
  for (let x = spacingPx; x < pdfW; x += spacingPx) {
    bCtx.strokeStyle = '#888';
    bCtx.beginPath(); bCtx.moveTo(x, 0); bCtx.lineTo(x, 12); bCtx.stroke();
    bCtx.fillStyle = '#ccc';
    const label = fmtVal(i * ptToUnit(spacingPt));
    const tw = bCtx.measureText(label).width;
    const lx = Math.min(x, pdfW - tw / 2 - 2);
    bCtx.fillText(label, Math.max(tw / 2 + 2, lx), 14 + fontSize);
    i++;
  }

  // --- Left ruler ---
  const leftCanvas = document.getElementById('ruler-left');
  leftCanvas.width = rulerW;
  leftCanvas.height = pdfH;
  leftCanvas.style.width = rulerW + 'px';
  leftCanvas.style.height = pdfH + 'px';
  const lCtx = leftCanvas.getContext('2d');
  lCtx.fillStyle = '#111';
  lCtx.fillRect(0, 0, leftCanvas.width, leftCanvas.height);
  lCtx.font = `${fontSize}px DM Mono, monospace`;
  lCtx.fillStyle = '#ccc';
  lCtx.strokeStyle = '#555';
  lCtx.lineWidth = 0.5;

  lCtx.textAlign = 'right';
  lCtx.textBaseline = 'middle';
  i = 1;
  for (let y = spacingPx; y < pdfH; y += spacingPx) {
    lCtx.strokeStyle = '#888';
    lCtx.beginPath(); lCtx.moveTo(rulerW, y); lCtx.lineTo(rulerW - 12, y); lCtx.stroke();
    const text = fmtVal(i * ptToUnit(spacingPt));
    lCtx.fillStyle = '#ccc';
    const ly = Math.max(fontSize / 2 + 2, Math.min(y, pdfH - fontSize / 2 - 2));
    lCtx.fillText(text, rulerW - 14, ly);
    i++;
  }

  // --- Right ruler ---
  const rightCanvas = document.getElementById('ruler-right');
  rightCanvas.width = rulerW;
  rightCanvas.height = pdfH;
  rightCanvas.style.width = rulerW + 'px';
  rightCanvas.style.height = pdfH + 'px';
  const rCtx = rightCanvas.getContext('2d');
  rCtx.fillStyle = '#111';
  rCtx.fillRect(0, 0, rightCanvas.width, rightCanvas.height);
  rCtx.font = `${fontSize}px DM Mono, monospace`;
  rCtx.fillStyle = '#ccc';
  rCtx.strokeStyle = '#555';
  rCtx.lineWidth = 0.5;

  rCtx.textAlign = 'left';
  rCtx.textBaseline = 'middle';
  i = 1;
  for (let y = spacingPx; y < pdfH; y += spacingPx) {
    rCtx.strokeStyle = '#888';
    rCtx.beginPath(); rCtx.moveTo(0, y); rCtx.lineTo(12, y); rCtx.stroke();
    const text = fmtVal(i * ptToUnit(spacingPt));
    rCtx.fillStyle = '#ccc';
    const ly = Math.max(fontSize / 2 + 2, Math.min(y, pdfH - fontSize / 2 - 2));
    rCtx.fillText(text, 14, ly);
    i++;
  }
}

function drawMeasurements() {
  const canvas = document.getElementById('measure-canvas');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Draw completed measurements
  for (const m of measurements) {
    drawMeasureLine(ctx, m.x1, m.y1, m.x2, m.y2, m.label, false);
  }

  // Draw active measurement
  if (rulerMode && rulerStart && currentMousePos) {
    drawMeasureLine(ctx, rulerStart.x, rulerStart.y, currentMousePos.x, currentMousePos.y, null, true);
  }

  // Draw all stored + in-progress lines
  drawAllLines();
}

function drawMeasureLine(ctx, x1, y1, x2, y2, label, isActive) {
  const color = isActive ? 'rgba(71,200,255,0.9)' : 'rgba(232,255,71,0.9)';
  const dx = x2 - x1, dy = y2 - y1;
  const len = Math.sqrt(dx*dx + dy*dy);
  if (len < 2) return;

  ctx.strokeStyle = color;
  ctx.lineWidth = 1.5;
  ctx.setLineDash(isActive ? [5, 3] : []);

  // Main line
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();

  // End caps
  const nx = -dy/len * 8, ny = dx/len * 8;
  ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(x1+nx, y1+ny); ctx.lineTo(x1-nx, y1-ny); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x2+nx, y2+ny); ctx.lineTo(x2-nx, y2-ny); ctx.stroke();

  // Label
  if (label) {
    const mx = (x1+x2)/2, my = (y1+y2)/2;
    ctx.font = 'bold 11px DM Mono, monospace';
    const tw = ctx.measureText(label).width;
    ctx.fillStyle = 'rgba(0,0,0,0.8)';
    ctx.fillRect(mx - tw/2 - 4, my - 10, tw + 8, 16);
    ctx.fillStyle = color;
    ctx.fillText(label, mx - tw/2, my + 2);
  }
}

function getCanvasPos(e) {
  const canvas = document.getElementById('measure-canvas');
  const rect = canvas.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return {
    x: (clientX - rect.left) * (canvas.width / rect.width),
    y: (clientY - rect.top) * (canvas.height / rect.height)
  };
}

function canvasPtToDoc(cx, cy) {
  return { x: cx / zoom, y: cy / zoom };
}

function getMeasureLabel(x1, y1, x2, y2) {
  const p1 = canvasPtToDoc(x1, y1), p2 = canvasPtToDoc(x2, y2);
  const dx = p2.x - p1.x, dy = p2.y - p1.y;
  const distPt = Math.sqrt(dx*dx + dy*dy);
  const distU = ptToUnit(distPt);
  const angle = Math.atan2(Math.abs(dy), Math.abs(dx)) * 180 / Math.PI;

  // If mostly horizontal or vertical, show W or H
  if (angle < 15) return `W: ${fmtVal(ptToUnit(Math.abs(dx)))} ${UNIT_LABEL[unit]}`;
  if (angle > 75) return `H: ${fmtVal(ptToUnit(Math.abs(dy)))} ${UNIT_LABEL[unit]}`;
  return `${fmtVal(distU)} ${UNIT_LABEL[unit]}`;
}

// Measure canvas events
document.getElementById('measure-canvas').addEventListener('mousedown', e => {
  const pos = getCanvasPos(e);

  if (rulerMode) {
    if (!rulerStart) {
      rulerStart = pos;
    } else {
      const label = getMeasureLabel(rulerStart.x, rulerStart.y, pos.x, pos.y);
      measurements.push({ x1: rulerStart.x, y1: rulerStart.y, x2: pos.x, y2: pos.y, label });
      addMeasurementToSidebar(label, rulerStart, pos);
      rulerStart = null;
      drawMeasurements();
    }
  } else if (lineDrawMode) {
    if (!lineStart) {
      lineStart = pos;
    } else {
      const end = shiftHeld ? snapToAxis(lineStart, pos) : pos;
      const ln = { x1: lineStart.x, y1: lineStart.y, x2: end.x, y2: end.y };
      drawnLines.push(ln);
      addLineToSidebar(ln);
      lineStart = null;
      drawMeasurements();
    }
  }
});

document.getElementById('measure-canvas').addEventListener('mousemove', e => {
  if (!rulerMode && !lineDrawMode) return;
  const pos = getCanvasPos(e);
  currentMousePos = pos;

  const tooltip = document.getElementById('measure-tooltip');
  tooltip.style.left = (e.clientX + 14) + 'px';
  tooltip.style.top = (e.clientY - 10) + 'px';

  if (rulerMode) {
    if (rulerStart) {
      tooltip.textContent = getMeasureLabel(rulerStart.x, rulerStart.y, pos.x, pos.y);
      tooltip.style.display = 'block';
    } else {
      const p = canvasPtToDoc(pos.x, pos.y);
      tooltip.textContent = `${fmtVal(ptToUnit(p.x))} , ${fmtVal(ptToUnit(p.y))} ${UNIT_LABEL[unit]}`;
      tooltip.style.display = 'block';
    }
  } else if (lineDrawMode) {
    if (lineStart) {
      const end = shiftHeld ? snapToAxis(lineStart, pos) : pos;
      const dx = Math.abs(end.x - lineStart.x) / zoom;
      const dy = Math.abs(end.y - lineStart.y) / zoom;
      const len = Math.sqrt(dx*dx + dy*dy);
      const snapNote = shiftHeld ? (Math.abs(end.y - lineStart.y) < 1 ? ' [H]' : ' [V]') : '';
      tooltip.textContent = `${fmtVal(ptToUnit(len))} ${UNIT_LABEL[unit]}${snapNote}`;
      tooltip.style.display = 'block';
    } else {
      tooltip.textContent = shiftHeld ? 'Shift: snap active' : 'Click to start line';
      tooltip.style.display = 'block';
    }
  }
  drawMeasurements();
});

document.getElementById('measure-canvas').addEventListener('mouseleave', () => {
  document.getElementById('measure-tooltip').style.display = 'none';
  currentMousePos = null;
  drawMeasurements();
});

// Right click to cancel
document.getElementById('measure-canvas').addEventListener('contextmenu', e => {
  e.preventDefault();
  rulerStart = null;
  lineStart = null;
  drawMeasurements();
});

// Touch support for mobile
document.getElementById('measure-canvas').addEventListener('touchstart', e => {
  if (!rulerMode && !lineDrawMode) return;
  e.preventDefault();
  const pos = getCanvasPos(e);

  if (rulerMode) {
    if (!rulerStart) {
      rulerStart = pos;
    } else {
      const label = getMeasureLabel(rulerStart.x, rulerStart.y, pos.x, pos.y);
      measurements.push({ x1: rulerStart.x, y1: rulerStart.y, x2: pos.x, y2: pos.y, label });
      addMeasurementToSidebar(label, rulerStart, pos);
      rulerStart = null;
      drawMeasurements();
    }
  } else if (lineDrawMode) {
    if (!lineStart) {
      lineStart = pos;
    } else {
      const end = pos;
      const ln = { x1: lineStart.x, y1: lineStart.y, x2: end.x, y2: end.y };
      drawnLines.push(ln);
      addLineToSidebar(ln);
      lineStart = null;
      drawMeasurements();
    }
  }
}, { passive: false });

document.getElementById('measure-canvas').addEventListener('touchmove', e => {
  if (!rulerMode && !lineDrawMode) return;
  e.preventDefault();
  const pos = getCanvasPos(e);
  currentMousePos = pos;
  drawMeasurements();
}, { passive: false });

function addMeasurementToSidebar(label, p1, p2) {
  const list = document.getElementById('measurements-list');
  const item = document.createElement('div');
  item.className = 'measurement-item';
  const p1doc = canvasPtToDoc(p1.x, p1.y), p2doc = canvasPtToDoc(p2.x, p2.y);
  const dx = Math.abs(p2doc.x - p1doc.x), dy = Math.abs(p2doc.y - p1doc.y);
  item.innerHTML = `<div class="val">${label}</div>
    <div class="sub">Δx: ${fmtVal(ptToUnit(dx))} · Δy: ${fmtVal(ptToUnit(dy))}</div>`;
  list.appendChild(item);
}

function clearMeasurements() {
  measurements = [];
  rulerStart = null;
  document.getElementById('measurements-list').innerHTML = '';
  drawMeasurements();
}

function setUnit(u) {
  unit = u;
  document.querySelectorAll('[data-unit]').forEach(el => {
    el.classList.toggle('active', el.dataset.unit === u);
  });
  const tickUnitLabel = document.getElementById('tick-unit-label');
  if (tickUnitLabel) tickUnitLabel.textContent = u;
  if (pdfDoc) { drawGrid(); drawMeasurements(); }
}

function toggleGrid() {
  showGrid = !showGrid;
  document.getElementById('grid-btn').classList.toggle('active', showGrid);
  drawGrid();
}

function toggleTicks() {
  showTicks = !showTicks;
  document.getElementById('tick-btn').classList.toggle('active', showTicks);
  drawGrid();
}

function toggleTickPopover() {
  document.getElementById('tick-popover').classList.toggle('open');
}

function setTickMode(mode) {
  tickMode = mode;
  document.querySelectorAll('[data-tick-mode]').forEach(el => {
    el.classList.toggle('active', el.dataset.tickMode === mode);
  });
  drawGrid();
}

function setTickSpacing(val) {
  const num = parseFloat(val);
  tickSpacingCustom = (isNaN(num) || num <= 0) ? null : num;
  drawGrid();
}

// Close popover when clicking outside
document.addEventListener('click', e => {
  const popover = document.getElementById('tick-popover');
  if (!popover) return;
  const wrapper = e.target.closest('.tick-wrapper');
  if (!wrapper) popover.classList.remove('open');
});

function toggleRuler() {
  rulerMode = !rulerMode;
  if (rulerMode) {
    lineDrawMode = false;
    lineStart = null;
    document.getElementById('line-btn').classList.remove('active');
  }
  rulerStart = null;
  document.getElementById('ruler-btn').classList.toggle('active', rulerMode);
  document.getElementById('measure-canvas').style.cursor = rulerMode ? 'crosshair' : 'default';
  document.getElementById('scroll-container').style.cursor = rulerMode ? 'crosshair' : 'grab';
  drawMeasurements();
}

function adjustZoom(delta) {
  zoom = Math.max(0.25, Math.min(4, zoom + delta));
  document.getElementById('zoom-label').textContent = Math.round(zoom * 100) + '%';
  if (pdfDoc) renderPage();
}

// File input
document.getElementById('file-input').addEventListener('change', e => {
  if (e.target.files[0]) loadPDF(e.target.files[0]);
});

// Drag and drop
const uploadZone = document.getElementById('upload-zone');
document.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('drag-over'); });
document.addEventListener('dragleave', () => uploadZone.classList.remove('drag-over'));
document.addEventListener('drop', e => {
  e.preventDefault();
  uploadZone.classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (file && file.type === 'application/pdf') loadPDF(file);
});

// ── DRAW LINE TOOL ──────────────────────────────────────────

function snapToAxis(start, end) {
  // If shift held, snap to perfectly horizontal or vertical
  const dx = Math.abs(end.x - start.x);
  const dy = Math.abs(end.y - start.y);
  if (dx > dy) return { x: end.x, y: start.y }; // horizontal
  return { x: start.x, y: end.y };               // vertical
}

function drawAllLines() {
  const canvas = document.getElementById('measure-canvas');
  const ctx = canvas.getContext('2d');

  // Draw all stored lines
  for (const ln of drawnLines) {
    ctx.strokeStyle = 'rgba(255, 107, 107, 0.85)';
    ctx.lineWidth = 1.2;
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.moveTo(ln.x1, ln.y1);
    ctx.lineTo(ln.x2, ln.y2);
    ctx.stroke();
  }

  // Draw in-progress line
  if (lineDrawMode && lineStart && currentMousePos) {
    const end = shiftHeld ? snapToAxis(lineStart, currentMousePos) : currentMousePos;
    ctx.strokeStyle = 'rgba(255, 107, 107, 0.6)';
    ctx.lineWidth = 1.2;
    ctx.setLineDash([6, 3]);
    ctx.beginPath();
    ctx.moveTo(lineStart.x, lineStart.y);
    ctx.lineTo(end.x, end.y);
    ctx.stroke();
    ctx.setLineDash([]);
  }
}

function toggleLineDraw() {
  lineDrawMode = !lineDrawMode;
  if (lineDrawMode) {
    rulerMode = false;
    rulerStart = null;
    document.getElementById('ruler-btn').classList.remove('active');
  }
  lineStart = null;
  document.getElementById('line-btn').classList.toggle('active', lineDrawMode);
  document.getElementById('measure-canvas').style.cursor = lineDrawMode ? 'crosshair' : 'default';
  drawMeasurements();
}

function clearLines() {
  drawnLines = [];
  lineStart = null;
  document.getElementById('lines-list').innerHTML =
    '<div style="font-size:11px;font-family:\'DM Mono\',monospace;color:var(--muted)">No lines yet. Hold Shift to snap H/V.</div>';
  drawMeasurements();
}

function addLineToSidebar(ln) {
  const list = document.getElementById('lines-list');
  // Remove placeholder text if present
  if (list.querySelector('div[style]')) list.innerHTML = '';
  const isH = Math.abs(ln.y2 - ln.y1) < 1;
  const isV = Math.abs(ln.x2 - ln.x1) < 1;
  const type = isH ? 'Horizontal' : isV ? 'Vertical' : 'Diagonal';
  const p1 = canvasPtToDoc(ln.x1, ln.y1), p2 = canvasPtToDoc(ln.x2, ln.y2);
  const dx = Math.abs(p2.x - p1.x), dy = Math.abs(p2.y - p1.y);
  const len = Math.sqrt(dx*dx + dy*dy);
  const item = document.createElement('div');
  item.className = 'measurement-item';
  item.style.borderColor = 'rgba(255,107,107,0.4)';
  item.innerHTML = `<div class="val" style="color:var(--accent3)">${type}</div>
    <div class="sub">${fmtVal(ptToUnit(len))} ${UNIT_LABEL[unit]}</div>`;
  list.appendChild(item);
}

// Shift key tracking
document.addEventListener('keydown', e => {
  if (e.key === 'Shift') { shiftHeld = true; if (lineDrawMode) drawMeasurements(); }
  // Escape cancels active tool start point
  if (e.key === 'Escape') { rulerStart = null; lineStart = null; drawMeasurements(); }
});
document.addEventListener('keyup', e => {
  if (e.key === 'Shift') { shiftHeld = false; if (lineDrawMode) drawMeasurements(); }
});

// ========== TILE FOR PRINT ==========

const SHEET_SIZES_MM = {
  A4: { w: 210, h: 297 },
  A3: { w: 297, h: 420 },
  Letter: { w: 215.9, h: 279.4 },
};

let tileOrientation = 'portrait';
let tileCropMarks = true;
let tileTrimBleed = false;
let tileAlignH = 'left';   // left | center | right
let tileAlignV = 'top';    // top | middle | bottom

function openTilePanel() {
  if (!pdfDoc) return;
  document.getElementById('tile-modal').classList.add('open');
  const srcW = (pageWidthPt * PT_TO.mm).toFixed(1);
  const srcH = (pageHeightPt * PT_TO.mm).toFixed(1);
  document.getElementById('tile-src-w').value = srcW;
  document.getElementById('tile-src-h').value = srcH;
  updateTilePreview();
}

function closeTilePanel() {
  document.getElementById('tile-modal').classList.remove('open');
}

function onTileSheetChange() {
  const val = document.getElementById('tile-sheet-size').value;
  document.getElementById('tile-custom-dims').style.display = val === 'custom' ? 'flex' : 'none';
  updateTilePreview();
}

function setTileOrientation(orient) {
  tileOrientation = orient;
  document.querySelectorAll('[data-orient]').forEach(el => {
    el.classList.toggle('active', el.dataset.orient === orient);
  });
  updateTilePreview();
}

function setTileCropMarks(on) {
  tileCropMarks = on;
  document.querySelectorAll('[data-crop]').forEach(el => {
    el.classList.toggle('active', (el.dataset.crop === 'on') === on);
  });
  updateTilePreview();
}

function setTileTrim(on) {
  tileTrimBleed = on;
  document.querySelectorAll('[data-trim]').forEach(el => {
    el.classList.toggle('active', (el.dataset.trim === 'on') === on);
  });
  updateTilePreview();
}

function setTileAlignH(val) {
  tileAlignH = val;
  document.querySelectorAll('[data-alignh]').forEach(el => {
    el.classList.toggle('active', el.dataset.alignh === val);
  });
  updateTilePreview();
}

function setTileAlignV(val) {
  tileAlignV = val;
  document.querySelectorAll('[data-alignv]').forEach(el => {
    el.classList.toggle('active', el.dataset.alignv === val);
  });
  updateTilePreview();
}

function getSheetDimsMM() {
  const sel = document.getElementById('tile-sheet-size').value;
  let w, h;
  if (sel === 'custom') {
    w = parseFloat(document.getElementById('tile-custom-w').value) || 210;
    h = parseFloat(document.getElementById('tile-custom-h').value) || 297;
  } else {
    const s = SHEET_SIZES_MM[sel];
    w = s.w; h = s.h;
  }
  if (tileOrientation === 'landscape') { const tmp = w; w = h; h = tmp; }
  return { w, h };
}

function computeTileLayout() {
  const sheet = getSheetDimsMM();
  const margin = parseFloat(document.getElementById('tile-margin').value) || 0;
  const gap = parseFloat(document.getElementById('tile-gap').value) || 0;
  const srcW = parseFloat(document.getElementById('tile-src-w').value) || (pageWidthPt * PT_TO.mm);
  const srcH = parseFloat(document.getElementById('tile-src-h').value) || (pageHeightPt * PT_TO.mm);
  const usableW = sheet.w - 2 * margin;
  const usableH = sheet.h - 2 * margin;
  const cols = Math.max(0, Math.floor((usableW + gap) / (srcW + gap)));
  const rows = Math.max(0, Math.floor((usableH + gap) / (srcH + gap)));
  const gridW = cols > 0 ? cols * srcW + (cols - 1) * gap : 0;
  const gridH = rows > 0 ? rows * srcH + (rows - 1) * gap : 0;
  const extraW = usableW - gridW;
  const extraH = usableH - gridH;
  const offsetX = tileAlignH === 'center' ? extraW / 2 : tileAlignH === 'right' ? extraW : 0;
  const offsetY = tileAlignV === 'middle' ? extraH / 2 : tileAlignV === 'bottom' ? extraH : 0;
  return { sheet, margin, gap, srcW, srcH, cols, rows, total: cols * rows, offsetX, offsetY };
}

function updateTilePreview() {
  if (!pdfDoc) return;

  // Show trim option if source size differs from detected PDF size
  const detectedW = (pageWidthPt * PT_TO.mm).toFixed(1);
  const detectedH = (pageHeightPt * PT_TO.mm).toFixed(1);
  const inputW = document.getElementById('tile-src-w').value;
  const inputH = document.getElementById('tile-src-h').value;
  const sizeChanged = inputW !== detectedW || inputH !== detectedH;
  document.getElementById('tile-trim-row').style.display = sizeChanged ? 'flex' : 'none';
  if (!sizeChanged) tileTrimBleed = false;

  const layout = computeTileLayout();
  const { sheet, margin, gap, srcW, srcH, cols, rows, total } = layout;

  // Update summary
  const sumEl = document.getElementById('tile-summary');
  if (total === 0) {
    sumEl.textContent = 'Source is too large for this sheet';
    sumEl.style.color = 'var(--danger, #ff6b6b)';
  } else {
    sumEl.textContent = `${cols} x ${rows} = ${total} copies per sheet`;
    sumEl.style.color = 'var(--accent)';
  }

  // Draw preview
  const canvas = document.getElementById('tile-preview-canvas');
  const maxW = 260, maxH = 360;
  const scale = Math.min(maxW / sheet.w, maxH / sheet.h);
  canvas.width = Math.round(sheet.w * scale);
  canvas.height = Math.round(sheet.h * scale);

  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Margin area
  const mS = margin * scale;
  ctx.strokeStyle = '#ccc';
  ctx.lineWidth = 0.5;
  ctx.setLineDash([4, 3]);
  ctx.strokeRect(mS, mS, canvas.width - 2 * mS, canvas.height - 2 * mS);
  ctx.setLineDash([]);

  // Draw copies
  const gS = gap * scale;
  const cW = srcW * scale;
  const cH = srcH * scale;
  const oX = layout.offsetX * scale;
  const oY = layout.offsetY * scale;

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const x = mS + oX + c * (cW + gS);
      const y = mS + oY + r * (cH + gS);
      ctx.fillStyle = '#f0ece4';
      ctx.fillRect(x, y, cW, cH);
      ctx.strokeStyle = '#bbb';
      ctx.lineWidth = 0.5;
      ctx.strokeRect(x, y, cW, cH);
    }
  }

  // Crop marks: full cut lines extending to sheet edges
  if (tileCropMarks && total > 0) {
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 0.5;
    const cropExt = Math.max(mS, 3 * scale); // extend to margin or 3mm min

    // Vertical cut lines (at each column boundary)
    for (let c = 0; c <= cols; c++) {
      // Left edge of column c
      if (c < cols) {
        const xl = mS + oX + c * (cW + gS);
        ctx.beginPath(); ctx.moveTo(xl, 0); ctx.lineTo(xl, mS + oY); ctx.stroke();
        const gridBottom = mS + oY + rows * cH + (rows - 1) * gS;
        ctx.beginPath(); ctx.moveTo(xl, gridBottom); ctx.lineTo(xl, canvas.height); ctx.stroke();
      }
      // Right edge of column c-1
      if (c > 0) {
        const xr = mS + oX + c * cW + (c - 1) * gS;
        ctx.beginPath(); ctx.moveTo(xr, 0); ctx.lineTo(xr, mS + oY); ctx.stroke();
        const gridBottom = mS + oY + rows * cH + (rows - 1) * gS;
        ctx.beginPath(); ctx.moveTo(xr, gridBottom); ctx.lineTo(xr, canvas.height); ctx.stroke();
      }
    }

    // Horizontal cut lines (at each row boundary)
    for (let r = 0; r <= rows; r++) {
      if (r < rows) {
        const yt = mS + oY + r * (cH + gS);
        ctx.beginPath(); ctx.moveTo(0, yt); ctx.lineTo(mS + oX, yt); ctx.stroke();
        const gridRight = mS + oX + cols * cW + (cols - 1) * gS;
        ctx.beginPath(); ctx.moveTo(gridRight, yt); ctx.lineTo(canvas.width, yt); ctx.stroke();
      }
      if (r > 0) {
        const yb = mS + oY + r * cH + (r - 1) * gS;
        ctx.beginPath(); ctx.moveTo(0, yb); ctx.lineTo(mS + oX, yb); ctx.stroke();
        const gridRight = mS + oX + cols * cW + (cols - 1) * gS;
        ctx.beginPath(); ctx.moveTo(gridRight, yb); ctx.lineTo(canvas.width, yb); ctx.stroke();
      }
    }
  }
}

async function exportTiledPDF() {
  const layout = computeTileLayout();
  if (layout.total === 0) return;

  const { PDFDocument, rgb } = PDFLib;
  const srcDoc = await PDFDocument.load(pdfRawBytes);

  // If trimming, modify the source page's CropBox before embedding
  if (tileTrimBleed) {
    const mmToPt = 2.83465;
    const srcPage = srcDoc.getPage(0);
    const { width: origW, height: origH } = srcPage.getSize();
    const trimW = layout.srcW * mmToPt;
    const trimH = layout.srcH * mmToPt;
    const offsetX = (origW - trimW) / 2;
    const offsetY = (origH - trimH) / 2;
    srcPage.setCropBox(offsetX, offsetY, trimW, trimH);
  }

  const newDoc = await PDFDocument.create();
  const [embeddedPage] = await newDoc.embedPdf(srcDoc, [0]);

  const mmToPt = 2.83465;
  const sheetWPt = layout.sheet.w * mmToPt;
  const sheetHPt = layout.sheet.h * mmToPt;
  const marginPt = layout.margin * mmToPt;
  const gapPt = layout.gap * mmToPt;
  const srcWPt = layout.srcW * mmToPt;
  const srcHPt = layout.srcH * mmToPt;

  const page = newDoc.addPage([sheetWPt, sheetHPt]);

  // Alignment offsets
  const oXPt = layout.offsetX * mmToPt;
  const oYPt = layout.offsetY * mmToPt;

  // Place all copies
  for (let row = 0; row < layout.rows; row++) {
    for (let col = 0; col < layout.cols; col++) {
      const x = marginPt + oXPt + col * (srcWPt + gapPt);
      const y = sheetHPt - marginPt - oYPt - (row + 1) * srcHPt - row * gapPt;
      page.drawPage(embeddedPage, { x, y, width: srcWPt, height: srcHPt });
    }
  }

  // Crop marks: full cut lines extending to sheet edges
  if (tileCropMarks && layout.total > 0) {
    const black = rgb(0, 0, 0);
    const lw = 0.5;
    const gridBottom = sheetHPt - marginPt - oYPt - layout.rows * srcHPt - (layout.rows - 1) * gapPt;
    const gridTop = sheetHPt - marginPt - oYPt;
    const gridLeft = marginPt + oXPt;
    const gridRight = marginPt + oXPt + layout.cols * srcWPt + (layout.cols - 1) * gapPt;

    // Vertical cut lines
    for (let c = 0; c <= layout.cols; c++) {
      if (c < layout.cols) {
        const xl = marginPt + oXPt + c * (srcWPt + gapPt);
        page.drawLine({ start: { x: xl, y: sheetHPt }, end: { x: xl, y: gridTop }, thickness: lw, color: black });
        page.drawLine({ start: { x: xl, y: gridBottom }, end: { x: xl, y: 0 }, thickness: lw, color: black });
      }
      if (c > 0) {
        const xr = marginPt + oXPt + c * srcWPt + (c - 1) * gapPt;
        page.drawLine({ start: { x: xr, y: sheetHPt }, end: { x: xr, y: gridTop }, thickness: lw, color: black });
        page.drawLine({ start: { x: xr, y: gridBottom }, end: { x: xr, y: 0 }, thickness: lw, color: black });
      }
    }

    // Horizontal cut lines
    for (let r = 0; r <= layout.rows; r++) {
      if (r < layout.rows) {
        const yt = sheetHPt - marginPt - oYPt - r * (srcHPt + gapPt);
        page.drawLine({ start: { x: 0, y: yt }, end: { x: gridLeft, y: yt }, thickness: lw, color: black });
        page.drawLine({ start: { x: gridRight, y: yt }, end: { x: sheetWPt, y: yt }, thickness: lw, color: black });
      }
      if (r > 0) {
        const yb = sheetHPt - marginPt - oYPt - r * srcHPt - (r - 1) * gapPt;
        page.drawLine({ start: { x: 0, y: yb }, end: { x: gridLeft, y: yb }, thickness: lw, color: black });
        page.drawLine({ start: { x: gridRight, y: yb }, end: { x: sheetWPt, y: yb }, thickness: lw, color: black });
      }
    }
  }

  const pdfBytes = await newDoc.save();
  const blob = new Blob([pdfBytes], { type: 'application/pdf' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'tiled-output.pdf';
  a.click();
  URL.revokeObjectURL(url);
}

// Escape to close tile modal
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.getElementById('tile-modal').classList.contains('open')) {
    closeTilePanel();
  }
});
